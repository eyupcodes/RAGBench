[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbench"
version = "0.1.0"
description = "A modular benchmark toolkit for comparing chunking, embedding, and retrieval strategies on RAG datasets."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "RAGBench Contributors"}
]
keywords = ["rag", "retrieval", "benchmark", "chunking", "bm25", "vector-search", "mrr", "recall"]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
bm25 = [
    "rank-bm25>=0.2.2",
]
embeddings = [
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "rank-bm25>=0.2.2",
]
all = [
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
ragbench = "ragbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
